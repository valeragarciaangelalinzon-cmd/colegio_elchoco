{% extends 'layout.html' %}
{% block title %}Nueva Matrícula{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white py-3">
                <h4 class="m-0">📋 Registrar Nueva Matrícula</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Alumno</label>
                        <select name="id_alumno" class="form-select" required>
                            <option value="" disabled selected>Selecciona un alumno...</option>
                            {% for alumno in alumnos %}
                            <option value="{{ alumno.id_alumno }}">{{ alumno.nombre }} ({{ alumno.curso }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Fecha de Matrícula</label>
                        <input type="date" name="fecha_matricula" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Año Lectivo</label>
                        <input type="number" name="anio_lectivo" class="form-control" value="2026" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Observaciones</label>
                        <textarea name="observaciones" class="form-control" rows="3" placeholder="Detalles de la matrícula..."></textarea>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-dark">💾 Registrar Matrícula</button>
                        <a href="{{ url_for('matricula.index') }}" class="btn btn-outline-secondary">❌ Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
