<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Colegio El Choco{% endblock %}</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

    <!-- NAVBAR ESCOLAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/alumnos">🏫 Colegio El Choco</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/alumnos">👨‍🎓 Alumnos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/apoderados">👥 Apoderados</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/matriculas">📋 Matrículas</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO DINÁMICO -->
    <div class="container pb-5">
        {% block content %}{% endblock %}
    </div>

    <script src="/static/js/bootstrap.bundle.js"></script>
</body>
</html>
