{% extends 'layout.html' %}
{% block title %}Nuevo Alumno{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
            <!-- Header con estilo institucional -->
            <div class="card-header bg-primary bg-gradient text-white p-4 border-0">
                <div class="d-flex align-items-center">
                    <div class="bg-white bg-opacity-25 rounded-circle p-3 me-3 d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                        <i class="bi bi-person-plus-fill fs-4 text-white"></i>
                    </div>
                    <div>
                        <h4 class="fw-bold m-0 mb-1">Registrar Nuevo Alumno</h4>
                        <p class="text-white-50 small m-0">Ingresa los datos personales y asigna un apoderado responsable</p>
                    </div>
                </div>
            </div>

            <!-- Cuerpo del Formulario -->
            <div class="card-body p-4 p-md-5 bg-white">
                <form method="POST">
                    
                    <!-- Nombre Completo -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small text-uppercase tracking-wide">Nombre Completo</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
                            <input type="text" name="nombre" class="form-control bg-light border-start-0 ps-0" required placeholder="Ej: Mateo Pérez" autocomplete="off">
                        </div>
                    </div>

                    <!-- Fila doble: RUT y Fecha de Nacimiento -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary small text-uppercase tracking-wide">RUT</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-card-heading"></i></span>
                                <input type="text" name="rut" class="form-control bg-light border-start-0 ps-0" required placeholder="Ej: 22.333.444-1">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary small text-uppercase tracking-wide">Fecha de Nacimiento</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-calendar-event"></i></span>
                                <input type="date" name="fecha_nacimiento" class="form-control bg-light border-start-0 ps-0" required>
                            </div>
                        </div>
                    </div>

                    <!-- Curso -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary small text-uppercase tracking-wide">Curso</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-mortarboard"></i></span>
                            <input type="text" name="curso" class="form-control bg-light border-start-0 ps-0" required placeholder="Ej: 1° Medio A">
                        </div>
                    </div>

                    <!-- Apoderado Responsable -->
                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary small text-uppercase tracking-wide">Apoderado Responsable</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person-badge"></i></span>
                            <select name="id_apoderado" class="form-select bg-light border-start-0 ps-0" required>
                                <option value="" disabled selected>Selecciona un apoderado...</option>
                                {% for apoderado in apoderados %}
                                <option value="{{ apoderado.id_apoderado }}">{{ apoderado.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <hr class="my-4 text-muted opacity-25">

                    <!-- Acciones -->
                    <div class="d-flex flex-column flex-sm-row gap-2 justify-content-end">
                        <a href="{{ url_for('alumno.index') }}" class="btn btn-outline-secondary px-4 py-2 order-2 order-sm-1">
                            <i class="bi bi-x-circle me-1"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary px-4 py-2 order-1 order-sm-2 fw-semibold">
                            <i class="bi bi-check-circle-fill me-1"></i> Guardar Alumno
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
