{% extends 'layout.html' %}
{% block title %}Nuevo Alumno{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-success text-white py-3">
                <h4 class="m-0">➕ Registrar Nuevo Alumno</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nombre Completo</label>
                        <input type="text" name="nombre" class="form-control" required placeholder="Ej: Mateo Pérez">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">RUT</label>
                        <input type="text" name="rut" class="form-control" required placeholder="Ej: 22.333.444-1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Curso</label>
                        <input type="text" name="curso" class="form-control" required placeholder="Ej: 1° Medio A">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Fecha de Nacimiento</label>
                        <input type="date" name="fecha_nacimiento" class="form-control" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Apoderado Responsable</label>
                        <select name="id_apoderado" class="form-select" required>
                            <option value="" disabled selected>Selecciona un apoderado...</option>
                            {% for apoderado in apoderados %}
                            <option value="{{ apoderado.id_apoderado }}">{{ apoderado.nombre }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">💾 Guardar Alumno</button>
                        <a href="{{ url_for('alumno.index') }}" class="btn btn-outline-secondary">❌ Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
