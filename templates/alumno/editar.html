{% extends 'layout.html' %}
{% block title %}Editar Alumno{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-warning py-3">
                <h4 class="m-0">✏️ Editar Alumno</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nombre Completo</label>
                        <input type="text" name="nombre" class="form-control" value="{{ alumno.nombre }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">RUT</label>
                        <input type="text" name="rut" class="form-control" value="{{ alumno.rut }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Curso</label>
                        <input type="text" name="curso" class="form-control" value="{{ alumno.curso }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Fecha de Nacimiento</label>
                        <input type="date" name="fecha_nacimiento" class="form-control" value="{{ alumno.fecha_nacimiento }}" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Apoderado Responsable</label>
                        <select name="id_apoderado" class="form-select" required>
                            {% for apoderado in apoderados %}
                            <option value="{{ apoderado.id_apoderado }}" {% if apoderado.id_apoderado == alumno.id_apoderado %}selected{% endif %}>
                                {{ apoderado.nombre }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-warning">💾 Guardar Cambios</button>
                        <a href="{{ url_for('alumno.index') }}" class="btn btn-outline-secondary">❌ Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
